# Spring Application Name
spring.application.name=shiftiq-platform
server.port=${PORT:8080}

# Proxy / Forwarded Headers (secure client IP resolution for the rate limiter).
# See application.properties: 'native' relies on Tomcat's RemoteIpValve and only trusts
# X-Forwarded-* from peers listed in server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native
# Set only when the edge proxy has a public IP (override via env if preferred):
# server.tomcat.remoteip.internal-proxies=<CIDR or regex of the proxy>

# Database Configuration
spring.jpa.database=POSTGRESQL
spring.sql.init.platform=postgres
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=require
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=com.tuxlogic.shiftiq.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
# The schema is owned by Flyway; Hibernate only verifies that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
authorization.jwt.secret=${JWT_SECRET}
# Access tokens are deliberately short lived; clients renew them with the refresh token.
authorization.jwt.access-token.expiration.minutes=15
authorization.jwt.refresh-token.expiration.days=7

# Application Settings
app.frontend.url=https://atelier-webapp-11848.vercel.app

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID}

# Factos Integration
factos.api.url=${FACTOS_API_URL:https://factos-reva.onrender.com}
factos.api.key=${FACTOS_API_KEY}

# Mercado Pago Integration
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET:}