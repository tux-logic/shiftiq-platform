version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: shiftiq-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=shiftiq_db
      - POSTGRES_USER=shiftiq_user
      - POSTGRES_PASSWORD=shiftiq_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
